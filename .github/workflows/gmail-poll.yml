# Worker trigger: wakes the free-tier backend (Render sleeps after 15 min idle) every hour.
# Each wake sends due deadline reminders (24h and 3h before); the Gmail job-alert poll and
# Autopilot still run once a day per user (both skip users that aren't due). Needs repo
# secrets BACKEND_URL and CRON_SECRET (same value as the Render env var). See docs/DEPLOYMENT.md.
name: Gmail poll

on:
  schedule:
    - cron: "30 * * * *" # hourly, so the 3-hour deadline reminder is never slept through
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_GMAIL_POLL == 'true' }}
    steps:
      - name: Trigger poll
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # First request may take ~60s while the free instance wakes up.
          curl --fail --silent --show-error --max-time 300 --retry 2 --retry-delay 20 \
            -X POST "$BACKEND_URL/api/internal/gmail/poll" \
            -H "X-Cron-Secret: $CRON_SECRET"
