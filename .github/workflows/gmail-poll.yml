# Daily worker trigger: wakes the free-tier backend (Render sleeps after 15 min idle) and runs
# the Gmail job-alert poll and Autopilot (both only act on users that are due today). Needs repo secrets BACKEND_URL and CRON_SECRET (same value as the
# Render env var). See docs/DEPLOYMENT.md.
name: Gmail poll

on:
  schedule:
    - cron: "30 3 * * *" # daily, 09:00 IST
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_GMAIL_POLL == 'true' }}
    steps:
      - name: Trigger poll
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # First request may take ~60s while the free instance wakes up.
          curl --fail --silent --show-error --max-time 300 --retry 2 --retry-delay 20 \
            -X POST "$BACKEND_URL/api/internal/gmail/poll" \
            -H "X-Cron-Secret: $CRON_SECRET"
