# Pathlight — local development stack (Gate 2, MongoDB)
# mongo, redis, backend are runnable now. frontend stays commented out until Gate 8.

version: "3.9"

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"

  backend:
    build: ../../backend
    env_file: ../../.env
    environment:
      MONGO_URI: mongodb://mongo:27017
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      - mongo
      - redis
    volumes:
      - chroma_data:/app/chroma_data
      - uploads_data:/app/data/uploads

  # frontend:
  #   build: ../../frontend
  #   env_file: ../../.env
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend

volumes:
  mongo_data:
  chroma_data:
  uploads_data:
