# Render Blueprint — Gate 11 (docs/DEPLOYMENT.md). Render → New → Blueprint → pick this repo.
# Secrets are `sync: false`: Render prompts for them on first deploy; they never live in git.
services:
  - type: web
    name: pathlight-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore  # closest free region to India
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MONGO_DB_NAME
        value: pathlight
      - key: MONGO_URI
        sync: false  # MongoDB Atlas connection string
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_API_KEY
        sync: false
      - key: LLM_MODEL_SMALL
        value: gemini-3.1-flash-lite
      - key: LLM_MODEL_STRONG
        value: gemini-3.6-flash
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GOOGLE_API_KEYS
        sync: false  # optional: extra shared Gemini keys, comma-separated (quota fallbacks)
      - key: FRONTEND_URL
        sync: false  # e.g. https://pathlight.vercel.app
      - key: CORS_ORIGINS
        sync: false  # same as FRONTEND_URL
      - key: CORS_ORIGIN_REGEX
        sync: false  # optional, for Vercel preview URLs
      - key: GMAIL_MCP_CLIENT_ID
        sync: false
      - key: GMAIL_MCP_CLIENT_SECRET
        sync: false
      - key: GMAIL_OAUTH_REDIRECT_URI
        sync: false  # https://<service>.onrender.com/api/integrations/gmail/callback
      - key: TOKEN_ENCRYPTION_KEY
        sync: false  # copy the SAME key as local only if migrating local tokens; else generate fresh
      - key: CRON_SECRET
        generateValue: true
      # --- Added for launch (see docs/DEPLOYMENT.md "Launch checklist") ---
      - key: ADMIN_EMAILS
        sync: false  # your email — unlocks /admin
      - key: ADZUNA_APP_ID
        sync: false  # free: developer.adzuna.com — main source of fresher jobs
      - key: ADZUNA_APP_KEY
        sync: false
      - key: JOOBLE_API_KEY
        sync: false  # free: jooble.org/api/about
      - key: GOOGLE_LOGIN_CLIENT_ID
        sync: false  # optional: separate PUBLISHED OAuth client for "Continue with Google"
      - key: GOOGLE_LOGIN_CLIENT_SECRET
        sync: false
      - key: GOOGLE_LOGIN_REDIRECT_URI
        sync: false  # https://<service>.onrender.com/api/auth/google/callback
      - key: SMTP_HOST
        sync: false  # optional, for password-reset emails, e.g. smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false  # Gmail: an App Password, not your account password
      - key: SMTP_FROM
        sync: false  # e.g. Pathlight <yourapp@gmail.com>
      - key: INBOUND_EMAIL_DOMAIN
        sync: false  # forwarded job alerts, e.g. pathlightmail.in (docs/DEPLOYMENT.md)
      - key: INBOUND_WEBHOOK_SECRET
        sync: false  # same value as INBOUND_SECRET on the Cloudflare email worker

